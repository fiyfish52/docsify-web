version: '3.8'

services:
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "9100:9000"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    networks:
      - minio-cluster
    depends_on:
      - minio1
      - minio2
      - minio3
      - minio4
  minio1:
    image: minio/minio:latest
    container_name: minio1
    ports:
      - "9001:9000"  # API 端口
      - "9002:9001"  # 控制台端口
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - ./data1:/data
    command: server http://minio{1...4}/data --console-address ":9001"
    networks:
      - minio-cluster

  minio2:
    image: minio/minio:latest
    container_name: minio2
    ports:
      - "9003:9000"
      - "9004:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - ./data2:/data
    command: server http://minio{1...4}/data --console-address ":9001"
    networks:
      - minio-cluster

  minio3:
    image: minio/minio:latest
    container_name: minio3
    ports:
      - "9005:9000"
      - "9006:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - ./data3:/data
    command: server http://minio{1...4}/data --console-address ":9001"
    networks:
      - minio-cluster

  minio4:
    image: minio/minio:latest
    container_name: minio4
    ports:
      - "9007:9000"
      - "9008:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - ./data4:/data
    command: server http://minio{1...4}/data --console-address ":9001"
    networks:
      - minio-cluster

networks:
  minio-cluster:
    driver: bridge