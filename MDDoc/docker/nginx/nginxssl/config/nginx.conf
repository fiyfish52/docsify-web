events {}

http {
    server {
        listen 443 ssl;
        server_name www.shanzha.work;

        ssl_certificate /usr1/software/docker/nginx-ssl/ssl/certificate.crt;
        ssl_certificate_key /usr1/software/docker/nginx-ssl/ssl/private.key;

        location / {
           root   /usr1/project/docsify-web;
           index  index.html ;
       }
    }

    server {
        listen 80;
        server_name www.shanzha.work;
        return 301 https://$host$request_uri;
    }
}