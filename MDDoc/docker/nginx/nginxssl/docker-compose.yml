version: '3.8'

services:
  nginx:
    image: nginx:latest
    container_name: nginx-https
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
      - ./html:/usr/share/nginx/html
    networks:
      - nginx-network

networks:
  nginx-network:
    driver: bridge